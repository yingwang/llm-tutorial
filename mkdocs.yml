site_name: LLM 训练工程师完全指南 / The Complete LLM Training Engineer Guide
site_description: 从 Tokenizer 到 Post-Training，从单卡到万卡集群，从纯文本到多模态。From Tokenizer to Post-Training, from single GPU to 10K-GPU clusters, from text to multimodal.
site_url: https://yingwang.github.io/llm-tutorial/
repo_url: https://github.com/yingwang/llm-tutorial
repo_name: yingwang/llm-tutorial
edit_uri: edit/main/

docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yingwang
  alternate:
    - name: 中文
      link: /llm-tutorial/
      lang: zh
    - name: English
      link: /llm-tutorial/en/
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - mdx_truly_sane_lists
  - toc:
      permalink: true
      permalink_title: 链接到此节
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang:
        - en
        - zh

nav:
  - 中文:
    - 首页: README.md
    - 术语表: chapters/00-glossary.md
    - 第 1 章 — Tokenizer: chapters/01-tokenizer.md
    - 第 2 章 — 模型架构: chapters/02-architecture.md
    - 第 3 章 — 预训练: chapters/03-pretraining.md
    - 第 4 章 — 后训练: chapters/04-post-training.md
    - 第 5 章 — PEFT: chapters/05-peft.md
    - 第 6 章 — 训练基础设施: chapters/06-infra.md
    - 第 7 章 — 推理与部署: chapters/07-inference.md
    - 第 8 章 — Embedding 与 RAG: chapters/08-embedding-rag.md
    - 第 9 章 — 多模态: chapters/09-multimodal.md
    - 第 10 章 — 安全与对齐: chapters/10-safety-alignment.md
    - 第 11 章 — SOTA 模型: chapters/11-sota-models.md
    - 第 12 章 — 蒸馏与合并: chapters/12-distillation-merging.md
    - 第 13 章 — 实战路线图: chapters/13-roadmap.md
  - English:
    - Home: en/README.md
    - Glossary: en/00-glossary.md
    - Ch. 1 — Tokenizer: en/01-tokenizer.md
    - Ch. 2 — Architecture: en/02-architecture.md
    - Ch. 3 — Pretraining: en/03-pretraining.md
    - Ch. 4 — Post-Training: en/04-post-training.md
    - Ch. 5 — PEFT: en/05-peft.md
    - Ch. 6 — Training Infrastructure: en/06-infra.md
    - Ch. 7 — Inference & Deployment: en/07-inference.md
    - Ch. 8 — Embedding & RAG: en/08-embedding-rag.md
    - Ch. 9 — Multimodal: en/09-multimodal.md
    - Ch. 10 — Safety & Alignment: en/10-safety-alignment.md
    - Ch. 11 — SOTA Models: en/11-sota-models.md
    - Ch. 12 — Distillation & Merging: en/12-distillation-merging.md
    - Ch. 13 — Practical Roadmap: en/13-roadmap.md

